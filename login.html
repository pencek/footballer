<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>登录 - Footballer</title>


    <!-- Supabase JS -->

    <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- Supabase 配置 -->

    <script src="js/supabase.js"></script>


    <!-- 页面 CSS -->

    <link
            rel="stylesheet"
            href="css/login.css">

</head>


<body>


<div class="page">


    <!-- =========================
         背景
    ========================== -->

    <div class="background">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

        <div class="field">

            <div class="field-line horizontal"></div>

            <div class="field-line vertical"></div>

            <div class="center-circle"></div>

        </div>

    </div>



    <!-- =========================
         登录卡片
    ========================== -->

    <main class="login-card">


        <!-- Logo -->

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>

                <div class="brand-title">
                    FOOTBALLER
                </div>

                <div class="brand-subtitle">
                    PLAYER PLATFORM
                </div>

            </div>

        </div>



        <!-- 标题 -->

        <div class="welcome">

            <h1>
                欢迎你的到来，
                <span>球星！</span>
            </h1>

            <p>
                登录你的账号，开启你的足球之旅
            </p>

        </div>



        <!-- 错误提示 -->

        <div
                id="errorMessage"
                class="message error">
        </div>



        <!-- =========================
             登录表单
        ========================== -->

        <form id="loginForm">


            <!-- 账号 -->

            <div class="form-group">

                <label for="user">
                    账号
                </label>

                <div class="input-box">

                    <span class="icon">
                        👤
                    </span>

                    <input
                            type="text"
                            id="user"
                            placeholder="请输入账号"
                            autocomplete="username"
                            required>

                </div>

            </div>



            <!-- 密码 -->

            <div class="form-group">

                <label for="password">
                    密码
                </label>

                <div class="input-box">

                    <span class="icon">
                        🔒
                    </span>

                    <input
                            type="password"
                            id="password"
                            placeholder="请输入密码"
                            autocomplete="current-password"
                            required>

                    <button
                            type="button"
                            id="showPassword"
                            class="show-password">

                        👁

                    </button>

                </div>

            </div>



            <!-- 登录按钮 -->

            <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                <span id="buttonText">
                    登录
                </span>

                <span>
                    →
                </span>

            </button>


        </form>



        <!-- 注册 -->

        <div class="register">

            <span>
                还没有账号？
            </span>

            <a href="register.html">
                立即注册
            </a>

        </div>



        <!-- 底部 -->

        <div class="footer">

            ⚽

            <span>
                追逐梦想 · 永不止步
            </span>

        </div>


    </main>


</div>



<!-- 登录 JS -->

<script src="js/login.js"></script>


</body>

</html>
