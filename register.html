<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>注册 - Footballer</title>

    <!-- Supabase JS -->
    <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <!-- Supabase 配置 -->
    <script src="js/supabase.js"></script>

    <!-- CSS -->
    <link
            rel="stylesheet"
            href="css/register.css">

</head>


<body>


<div class="page">


    <!-- =========================
         背景
    ========================== -->

    <div class="background">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

        <div class="field">

            <div class="field-line horizontal"></div>

            <div class="field-line vertical"></div>

            <div class="center-circle"></div>

        </div>

    </div>



    <!-- =========================
         注册卡片
    ========================== -->

    <main class="register-card">


        <!-- Logo -->

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>

                <div class="brand-title">
                    FOOTBALLER
                </div>

                <div class="brand-subtitle">
                    PLAYER PLATFORM
                </div>

            </div>

        </div>



        <!-- 标题 -->

        <div class="welcome">

            <h1>
                创建你的
                <span>球星账号</span>
            </h1>

            <p>
                加入 Footballer，开始你的足球之旅
            </p>

        </div>



        <!-- 消息提示 -->

        <div
                id="message"
                class="message">
        </div>



        <!-- =========================
             注册表单
        ========================== -->

        <form id="registerForm">


            <!-- 用户名 -->

            <div class="form-group">

                <label for="name">
                    用户名
                </label>

                <div class="input-box">

                    <span class="icon">
                        👤
                    </span>

                    <input
                            type="text"
                            id="name"
                            placeholder="请输入用户名"
                            maxlength="30"
                            required>

                </div>

            </div>



            <!-- 账号 -->

            <div class="form-group">

                <label for="user">
                    账号
                </label>

                <div class="input-box">

                    <span class="icon">
                        @
                    </span>

                    <input
                            type="text"
                            id="user"
                            placeholder="请输入账号"
                            maxlength="30"
                            required>

                </div>

            </div>



            <!-- 密码 -->

            <div class="form-group">

                <label for="passwd">
                    密码
                </label>

                <div class="input-box">

                    <span class="icon">
                        🔒
                    </span>

                    <input
                            type="password"
                            id="passwd"
                            placeholder="请输入密码"
                            minlength="6"
                            maxlength="50"
                            required>

                    <button
                            type="button"
                            class="show-password"
                            data-target="passwd">

                        👁

                    </button>

                </div>

            </div>



            <!-- 确认密码 -->

            <div class="form-group">

                <label for="confirmPasswd">
                    确认密码
                </label>

                <div class="input-box">

                    <span class="icon">
                        🔐
                    </span>

                    <input
                            type="password"
                            id="confirmPasswd"
                            placeholder="请再次输入密码"
                            minlength="6"
                            maxlength="50"
                            required>

                    <button
                            type="button"
                            class="show-password"
                            data-target="confirmPasswd">

                        👁

                    </button>

                </div>

            </div>



            <!-- 注册按钮 -->

            <button
                    type="submit"
                    id="registerButton"
                    class="register-button">

                <span id="buttonText">
                    创建账号
                </span>

                <span>
                    →
                </span>

            </button>


        </form>



        <!-- 登录 -->

        <div class="login">

            <span>
                已经有账号？
            </span>

            <a href="login.html">
                返回登录
            </a>

        </div>



        <!-- 底部 -->

        <div class="footer">

            ⚽

            <span>
                追逐梦想 · 永不止步
            </span>

        </div>


    </main>


</div>



<script src="js/register.js"></script>


</body>

</html>
