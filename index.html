<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Footballer - 球员排行榜</title>


    <!-- =========================
         Supabase
    ========================== -->

    <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- =========================
         Supabase 配置
    ========================== -->

    <script src="js/supabase.js"></script>


    <!-- =========================
         页面 CSS
    ========================== -->

    <link
            rel="stylesheet"
            href="css/index.css">

</head>


<body>


<div class="page">


    <!-- ==================================================
         背景
    =================================================== -->

    <div class="background">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

        <div class="field">

            <div class="field-line horizontal"></div>

            <div class="field-line vertical"></div>

            <div class="center-circle"></div>

        </div>

    </div>



    <!-- ==================================================
         顶部导航栏
    =================================================== -->

    <header class="navbar">


        <!-- =====================
             Logo
        ====================== -->

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>


            <div>

                <div class="brand-title">
                    FOOTBALLER
                </div>

                <div class="brand-subtitle">
                    PLAYER PLATFORM
                </div>

            </div>

        </div>



        <!-- =====================
             用户信息
        ====================== -->

        <div class="user-area">

            <div
                    class="user-avatar"
                    id="currentUserAvatar">

                ?

            </div>


            <div
                    class="user-name"
                    id="currentUserName">

                用户

            </div>


            <button
                    id="logoutButton"
                    class="logout-button">

                退出

            </button>

        </div>


    </header>



    <!-- ==================================================
         主体
    =================================================== -->

    <main class="main">


        <!-- ==================================================
             页面标题
        =================================================== -->

        <section class="hero">


            <div class="hero-tag">

                ⚽ PLAYER RANKING

            </div>


            <h1>

                球员
                <span>排行榜</span>

            </h1>


            <p>

                根据所有球员评分的平均分进行排名

            </p>


            <!-- =====================
                 每日刷新提示
            ====================== -->

            <div class="hero-notice">

                <span>★</span>

                每日北京时间 04:00 自动刷新评分与评论

            </div>


        </section>



        <!-- ==================================================
             排行榜
        =================================================== -->

        <section class="ranking-card">


            <!-- =====================
                 排行榜头部
            ====================== -->

            <div class="ranking-header">


                <div>

                    <h2>
                        球员排名
                    </h2>


                    <p>

                        共

                        <span id="playerCount">
                            0
                        </span>

                        名球员

                    </p>

                </div>


                <button
                        id="refreshButton"
                        class="refresh-button">

                    <span>
                        ↻
                    </span>

                    刷新

                </button>


            </div>



            <!-- ==================================================
                 加载状态
            =================================================== -->

            <div
                    id="loading"
                    class="loading">

                <div class="loading-spinner"></div>

                <p>
                    正在加载球员数据...
                </p>

            </div>



            <!-- ==================================================
                 球员列表
            =================================================== -->

            <div
                    id="rankingList"
                    class="ranking-list">

                <!--

                    index.js 动态生成。

                    每个球员：

                    .player

                    ├── .player-main
                    │
                    │   ├── 排名
                    │   ├── 球员信息
                    │   ├── 平均评分
                    │   └── 评分按钮
                    │
                    └── .player-comments
                        │
                        ├── 评论标题
                        │
                        ├── 评论列表
                        │
                        ├── 查看全部评论
                        │
                        └── 评论提示

                -->

            </div>


        </section>


    </main>



    <!-- ==================================================
         评分 + 评论弹窗
    =================================================== -->

    <div
            id="ratingModal"
            class="modal">


        <div class="modal-content">


            <!-- =====================
                 关闭按钮
            ====================== -->

            <button
                    type="button"
                    id="closeModal"
                    class="close-modal">

                ×

            </button>



            <!-- =====================
                 图标
            ====================== -->

            <div class="modal-icon">

                ⭐

            </div>



            <!-- =====================
                 标题
            ====================== -->

            <h2>

                评价

                <span id="ratingPlayerName">
                    球员
                </span>

            </h2>


            <p class="modal-description">

                给这名球员评分，并写下你的评价

            </p>



            <!-- ==================================================
                 评分区域
            =================================================== -->

            <div class="rating-section">


                <div class="rating-section-title">

                    <span class="section-icon">
                        ⭐
                    </span>

                    <span>
                        球员评分
                    </span>

                </div>



                <!-- =====================
                     分数
                ====================== -->

                <div class="score-display">

                    <span id="scoreValue">
                        5
                    </span>

                    <small>
                        / 5
                    </small>

                </div>



                <!-- =====================
                     滑块
                ====================== -->

                <input
                        type="range"
                        id="scoreRange"
                        min="0"
                        max="5"
                        step="1"
                        value="5">



                <!-- =====================
                     刻度
                ====================== -->

                <div class="score-range-label">

                    <span>0</span>

                    <span>1</span>

                    <span>2</span>

                    <span>3</span>

                    <span>4</span>

                    <span>5</span>

                </div>


            </div>



            <!-- ==================================================
                 评论区域
            =================================================== -->

            <div class="comment-section">


                <!-- =====================
                     评论标题
                ====================== -->

                <div class="comment-section-header">

                    <div class="comment-section-title">

                        <span class="section-icon">
                            💬
                        </span>

                        <span>
                            评价内容
                        </span>

                    </div>


                    <span
                            id="commentLength"
                            class="comment-length">

                        0 / 200

                    </span>

                </div>



                <!-- =====================
                     评论输入框
                ====================== -->

                <textarea
                        id="commentInput"
                        class="comment-input"
                        maxlength="200"
                        placeholder="写下你对这名球员的评价，例如：速度很快，突破能力很强……"
                        rows="5"></textarea>


                <!-- =====================
                     评论提示
                ====================== -->

                <div class="comment-tip">

                    💡 每位用户每天可以评价一次

                </div>


            </div>



            <!-- ==================================================
                 提交按钮
            =================================================== -->

            <button
                    type="button"
                    id="submitRating"
                    class="submit-rating">

                <span>
                    ⭐
                </span>

                <span>
                    提交评分与评论
                </span>

            </button>


        </div>


    </div>



</div>



<!-- ==================================================
     首页 JS
=================================================== -->

<script src="js/index.js"></script>


</body>

</html>
