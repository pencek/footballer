<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Footballer - 球员排行榜</title>


    <!-- ==================================================
         Supabase
    =================================================== -->

    <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- ==================================================
         Supabase 配置
    =================================================== -->

    <script src="js/supabase.js"></script>


    <!-- ==================================================
         CSS
    =================================================== -->

    <link
            rel="stylesheet"
            href="css/index.css">

</head>


<body>


<div class="page">


    <!-- ==================================================
         背景
    =================================================== -->

    <div class="background">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

        <div class="field">

            <div class="field-line horizontal"></div>

            <div class="field-line vertical"></div>

            <div class="center-circle"></div>

        </div>

    </div>


    <!-- ==================================================
         顶部导航
    =================================================== -->

    <header class="navbar">

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>

                <div class="brand-title">
                    FOOTBALLER
                </div>

                <div class="brand-subtitle">
                    PLAYER PLATFORM
                </div>

            </div>

        </div>


        <!-- 用户 -->

        <div class="user-area">

            <div
                    class="user-avatar"
                    id="currentUserAvatar">

                ?

            </div>


            <div
                    class="user-name"
                    id="currentUserName">

                用户

            </div>


            <button
                    type="button"
                    id="logoutButton"
                    class="logout-button">

                退出

            </button>

        </div>

    </header>


    <!-- ==================================================
         主体
    =================================================== -->

    <main class="main">


        <!-- ==================================================
             Hero
        =================================================== -->

        <section class="hero">

            <div class="hero-tag">
                ⚽ PLAYER RANKING
            </div>


            <h1>

                球员
                <span>排行榜</span>

            </h1>


            <p>
                根据所有球员评分的平均分进行排名
            </p>


            <div class="hero-notice">

                <span>★</span>

                每日北京时间 04:00 自动刷新评分与评论

            </div>

        </section>


        <!-- ==================================================
             排行榜
        =================================================== -->

        <section class="ranking-card">


            <!-- 头部 -->

            <div class="ranking-header">

                <div>

                    <h2>
                        球员排名
                    </h2>

                    <p>

                        共

                        <span id="playerCount">
                            0
                        </span>

                        名球员

                    </p>

                </div>


                <button
                        type="button"
                        id="refreshButton"
                        class="refresh-button">

                    <span>↻</span>

                    刷新

                </button>

            </div>


            <!-- 加载 -->

            <div
                    id="loading"
                    class="loading">

                <div class="loading-spinner"></div>

                <p>
                    正在加载球员数据...
                </p>

            </div>


            <!-- 球员列表 -->

            <div
                    id="rankingList"
                    class="ranking-list">

            </div>


        </section>

    </main>


    <!-- ==================================================
         评分 + 评论弹窗
    =================================================== -->

    <div
            id="ratingModal"
            class="modal">


        <div class="modal-content">


            <!-- 关闭 -->

            <button
                    type="button"
                    id="closeModal"
                    class="close-modal">

                ×

            </button>


            <!-- 图标 -->

            <div class="modal-icon">
                ⭐
            </div>


            <!-- 标题 -->

            <h2>

                评价

                <span id="ratingPlayerName">
                    球员
                </span>

            </h2>


            <p class="modal-description">

                给这名球员评分，也可以留下你的评价

            </p>


            <!-- ==================================================
                 评分
            =================================================== -->

            <div class="rating-section">


                <div class="rating-section-title">

                    <span class="section-icon">
                        ⭐
                    </span>

                    <span>
                        球员评分
                    </span>

                </div>


                <div class="score-display">

                    <span id="scoreValue">
                        5
                    </span>

                    <small>
                        / 5
                    </small>

                </div>


                <input
                        type="range"
                        id="scoreRange"
                        min="0"
                        max="5"
                        step="1"
                        value="5">


                <div class="score-range-label">

                    <span>0</span>
                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
                    <span>5</span>

                </div>

            </div>


            <!-- ==================================================
                 评论
            =================================================== -->

            <div class="comment-section">


                <div class="comment-section-header">

                    <div class="comment-section-title">

                        <span class="section-icon">
                            💬
                        </span>

                        <span>
                            评价内容
                        </span>

                    </div>


                    <span
                            id="commentLength"
                            class="comment-length">

                        0 / 200

                    </span>

                </div>


                <textarea
                        id="commentInput"
                        class="comment-input"
                        maxlength="200"
                        placeholder="可以不填写评论，例如：速度很快，突破能力很强……"
                        rows="5"></textarea>


                <div class="comment-tip">

                    💡 评论可以不填写；当天再次评论会覆盖今天的评论

                </div>

            </div>


            <!-- ==================================================
                 提交
            =================================================== -->

            <button
                    type="button"
                    id="submitRating"
                    class="submit-rating">

                <span>
                    ⭐
                </span>

                <span>
                    提交评分
                </span>

            </button>


        </div>

    </div>


</div>


<!-- ==================================================
     JS
=================================================== -->

<script src="js/index.js"></script>


</body>

</html>
